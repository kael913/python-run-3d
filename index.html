<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 3D Runner</title>
    <!-- Tailwind CSS para diseño rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: system-ui, sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <!-- Canvas de Three.js -->
    <canvas id="game-canvas"></canvas>

    <!-- Interfaz HUD (Puntaje en juego) -->
    <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between pointer-events-none text-white font-bold text-xl drop-shadow">
        <div class="bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">Distancia: <span id="score-display">0m</span></div>
        <div class="bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">Monedas: <span id="coins-display">0</span></div>
    </div>

    <!-- Pantalla de Inicio -->
    <div id="screen-start" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center text-white z-20">
        <h1 class="text-5xl font-extrabold mb-2 tracking-tight text-indigo-400">PYTHON RUNNER 3D</h1>
        <p class="text-slate-400 mb-8">Usa las flechas (A/D/W o Flechas) o desliza en tu móvil</p>
        <button id="btn-start" disabled class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-8 py-4 rounded-2xl shadow-lg transition-transform active:scale-95 disabled:opacity-50">
            Cargando Pyodide y librerías...
        </button>
    </div>

    <!-- Pantalla de Game Over -->
    <div id="screen-gameover" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center text-white z-20 hidden">
        <h2 class="text-4xl font-extrabold text-red-500 mb-2">¡GAME OVER!</h2>
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-80 text-center mb-6 shadow-xl">
            <p class="text-slate-400 text-sm">Puntuación final</p>
            <p id="final-score" class="text-3xl font-bold text-white mb-4">0m</p>
            <p class="text-slate-400 text-sm">Monedas recolectadas</p>
            <p id="final-coins" class="text-xl font-bold text-yellow-400 mb-4">0</p>
            
            <div class="border-t border-slate-800 pt-4 mt-2">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Mejores Puntajes Locales</p>
                <ul id="board" class="text-sm space-y-1 text-slate-300">
                    <li>Cargando ranking...</li>
                </ul>
            </div>
        </div>
        <button id="btn-restart" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-8 py-3 rounded-2xl shadow-lg transition-transform active:scale-95">
            Jugar de nuevo
        </button>
    </div>

    <!-- Script de Inicialización de Pyodide -->
    <script>
        async function main() {
            let pyodide = await loadPyodide();
            // Descargar el archivo game.py al entorno virtual de Pyodide
            let response = await fetch("game.py");
            let code = await response.text();
            pyodide.FS.writeFile("game.py", code);
            
            // Ejecutar el juego
            await pyodide.runPythonAsync(`
                import game
            `);
        }
        main();
    </script>
</body>
</html>
